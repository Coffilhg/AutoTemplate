name: Publish to Roblox

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    tags: ["v*"]            # or push a tag like v1.0.0

permissions:
  contents: read

jobs:
  publish:
    # Never run in forks, even if someone enables Actions there
    if: github.repository_owner == 'Coffilhg'
    runs-on: ubuntu-latest
    environment: production   # add required reviewers here for extra safety
    steps:
      - uses: actions/checkout@v5

      - name: Install Rokit
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install tools from rokit.toml
        run: rokit install --no-trust-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # avoids GitHub API rate limits

      - name: Install Wally packages and types
        run: |
          wally install
          mkdir -p Packages ServerPackages DevPackages   # wally-package-types fails on missing folders
          rojo sourcemap default.project.json --output sourcemap.json
          wally-package-types -s sourcemap.json Packages/ ServerPackages/ DevPackages/

      - name: Build place
        run: rojo build default.project.json -o game.rbxl

      - name: Publish via Open Cloud
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: |
          curl --fail-with-body -sS -X POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published" \
            -H "x-api-key: ${API_KEY}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @game.rbxl
